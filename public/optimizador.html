<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Llantymoto — Optimizador de Paquetes</title>

<script>
// Loader con respaldo multi-CDN: si un CDN falla o desaparece, se intenta el siguiente.
function cargarScript(urls){return new Promise((res,rej)=>{
  const [u,...resto]=urls;
  if(!u)return rej(new Error('Todos los CDN fallaron'));
  const s=document.createElement('script');s.src=u;
  s.onload=()=>res(u);s.onerror=()=>cargarScript(resto).then(res,rej);
  document.head.appendChild(s);
});}
const CDN_PDFJS=[
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
  'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js'];
const CDN_PDFJS_WORKER=[
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
  'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js'];
const CDN_TESS=[
  'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js',
  'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  'https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js'];
let _pdfjsReady=cargarScript(CDN_PDFJS).then(async u=>{
  for(const w of CDN_PDFJS_WORKER){try{const r=await fetch(w,{method:'HEAD'});if(r.ok){pdfjsLib.GlobalWorkerOptions.workerSrc=w;return;}}catch(e){}}
  pdfjsLib.GlobalWorkerOptions.workerSrc=CDN_PDFJS_WORKER[0];
}).catch(()=>{window._pdfjsFallo=true;});
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;font-size:14px;line-height:1.5}
.topbar{background:#FF5C1E;border-bottom:none;padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(214,65,10,.35)}
.topbar-title{font-size:16px;font-weight:800;font-style:italic;letter-spacing:.04em;color:#fff}.topbar-title .lm-moto{color:#FFD9C6}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.85)}
.main{max-width:920px;margin:0 auto;padding:16px}
/* TABS */
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid #e0ddd6}
.tab{padding:9px 18px;font-size:13px;border:none;background:transparent;cursor:pointer;color:#888;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tab:hover{color:#1a1a18}
.tab.active{color:#FF5C1E;border-bottom-color:#FF5C1E;font-weight:500}
.tab.disabled{opacity:.35;cursor:not-allowed}
.tab-num{font-size:11px;background:#e0ddd6;color:#888;border-radius:10px;padding:1px 7px;font-weight:500}
.tab.active .tab-num{background:#FFEDE4;color:#B23A08}
/* CARDS */
.card{background:#fff;border:1px solid #e0ddd6;border-radius:12px;padding:16px 20px;margin-bottom:12px}
.section-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#888;margin-bottom:10px}
/* INPUTS */
input[type=number],input[type=text],select,textarea{height:34px;padding:0 10px;font-size:13px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#1a1a18;font-family:inherit;outline:none;width:100%}
textarea{height:60px;padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#FF5C1E;box-shadow:0 0 0 2px #FFEDE4}
input[type=checkbox]{width:16px;height:16px;accent-color:#FF5C1E;flex-shrink:0}
/* BUTTONS */
.btn{height:34px;padding:0 16px;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a18;display:inline-flex;align-items:center;gap:6px;font-family:inherit;white-space:nowrap}
.btn:hover{background:#f0f0ee}
.btn:active{transform:scale(.98)}
.btn-primary{background:#FF5C1E;border-color:#FF5C1E;color:#fff;font-weight:500}
.btn-primary:hover{background:#D94A0F}
.btn-secondary{background:#f5f5f3;border-color:#ddd}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-icon{width:28px;height:28px;padding:0;justify-content:center;color:#c44;border-color:#f5c0c0}
.btn-icon:hover{background:#fff0f0}
.btn-green-outline{border-color:#FF5C1E;color:#FF5C1E}
.btn-green-outline:hover{background:#FFEDE4}
/* PEDIDO ROWS */
.pedido-header{display:grid;grid-template-columns:28px 2fr .75fr 1.5fr .65fr .65fr 28px;gap:5px;align-items:center;font-size:11px;color:#888;font-weight:600;padding:2px 8px;margin-bottom:4px}
.pedido-row{display:grid;grid-template-columns:28px 2fr .75fr 1.5fr .65fr .65fr 28px;gap:5px;align-items:center;padding:5px 8px;border-radius:8px;border:1px solid #e8e5de;margin-bottom:4px;background:#fff}
.pedido-row:hover{border-color:#bbb}
.rnum{font-size:11px;color:#bbb;text-align:center}
.dbadge{font-size:11px;background:#f5f5f3;border-radius:4px;padding:3px 6px;color:#666;text-align:center;white-space:nowrap}
.wbadge{font-size:12px;text-align:center;color:#555}
/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.metric{background:#f5f5f3;border-radius:8px;padding:10px 14px}
.metric-label{font-size:11px;color:#888;margin-bottom:3px}
.metric-val{font-size:20px;font-weight:600}
.metric-sub{font-size:11px;color:#aaa;margin-top:2px}
.metric-best{background:#FFEDE4}.metric-best .metric-val{color:#D94A0F}
/* PACKAGES */
.pkt-wrap{margin-bottom:8px;border:1px solid #e0ddd6;border-radius:10px;overflow:hidden}
.pkt-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#f9f9f7;border-bottom:1px solid #e8e5de}
.pkt-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.pkt-body{padding:10px 14px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{font-size:11px;padding:3px 8px;border-radius:10px;border:1px solid #e0ddd6;background:#f5f5f3}
.dims-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.dim{text-align:center}
.dim-lbl{font-size:10px;color:#aaa}
.dim-val{font-size:12px;font-weight:600}
/* PILLS */
.pill{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600}
.pt1,.pt2{background:#FFEDE4;color:#B23A08}
.pt3,.pt4{background:#E6F1FB;color:#0C447C}
.pt5,.pt6{background:#FAEEDA;color:#633806}
.pt7{background:#FCEBEB;color:#791F1F}
/* ALERTS */
.alert{border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}
.alert-warn{background:#FAEEDA;border:1px solid #EF9F27;color:#633806}
.alert-ok{background:#FFEDE4;border:1px solid #5DCAA5;color:#B23A08}
.alert-info{background:#E6F1FB;border:1px solid #85B7EB;color:#0C447C}
/* TABLES */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:11px;font-weight:600;color:#888;padding:5px 8px;border-bottom:1px solid #e8e5de;text-align:left;background:#f9f9f7}
.tbl td{padding:6px 8px;border-bottom:1px solid #eee;vertical-align:middle}
.tbl .r{text-align:right}
.tbl .total-row td{font-weight:600;border-top:1px solid #ddd;border-bottom:none}
/* ENVIO FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:12px;color:#555;font-weight:500}
/* PACKING PREVIEW */
.pl-card{background:#fff;border:1px solid #e0ddd6;border-radius:10px;overflow:hidden;margin-bottom:8px}
.pl-pkt-head{background:#f9f9f7;border-bottom:1px solid #eee;padding:8px 14px;display:flex;justify-content:space-between;align-items:center}
.pl-pkt-body{padding:8px 14px}
.pl-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px dotted #eee}
.pl-row:last-child{border-bottom:none}
/* UPLOAD AREA */
.upload-area{border:2px dashed #ddd;border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:.2s;background:#fafaf8}
.upload-area:hover{border-color:#FF5C1E;background:#FFEDE4}
/* PREVIEW TABLE */
.preview-row{display:grid;grid-template-columns:2fr 1fr 1fr 80px;gap:8px;align-items:center;padding:5px 8px;border-bottom:1px solid #eee;font-size:13px}
.preview-row.header{font-size:11px;color:#888;font-weight:600;background:#f9f9f7;border-radius:6px 6px 0 0}
.match-yes{color:#D94A0F;font-size:11px}
.match-no{color:#c44;font-size:11px}
hr.div{border:none;border-top:1px solid #e8e5de;margin:14px 0}
/* GUIDE INPUTS */
.guide-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #eee}
.guide-row:last-child{border-bottom:none}
.guide-label{font-size:12px;font-weight:500;white-space:nowrap}
/* SPIN */
.spin{animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
/* KM DESTINOS */
.dest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.dest-btn{padding:6px 10px;font-size:12px;border:1px solid #e0ddd6;border-radius:8px;background:#fff;cursor:pointer;text-align:left;transition:.15s}
.dest-btn:hover{border-color:#FF5C1E;background:#FFEDE4;color:#B23A08}
.dest-btn .dest-name{font-weight:600;display:block}
.dest-btn .dest-km{font-size:11px;color:#888}
/* VERIFICACION */
.verif-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:8px;font-weight:600}
.verif-ok{background:#FFEDE4;color:#B23A08}
.verif-warn{background:#FAEEDA;color:#633806}
@media(max-width:600px){
  .pedido-header,.pedido-row{grid-template-columns:24px 1fr 55px 28px}
  .pedido-header span:nth-child(4),.pedido-row .dbadge,
  .pedido-header span:nth-child(5),.pedido-row .wbadge:first-of-type,
  .pedido-header span:nth-child(6),.pedido-row .wbadge:last-of-type{display:none}
  .dims-grid{grid-template-columns:repeat(3,1fr)}
  .form-grid,.form-grid-3{grid-template-columns:1fr}
  .dest-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

// ─── DESCRIPCIÓN DE LLANTA ───────────────────────────────────────────────────
function DESC(medida){
  const m=medida.toUpperCase();
  if(/^MOUSSE/.test(m))return`Mousse (caja) ${medida.replace(/^MOUSSE\s*/i,'')}`;
  if(/^\d+X[\d.]+/.test(m))return`Llanta ATV/UTV ${medida}`;
  if(/^\d+\.\d+-\d+$/.test(m))return`Llanta moto ${medida}`;
  if(m.includes('ZR'))return`Llanta moto radial ${medida}`;
  if(m.includes('R')&&m.includes('/'))return`Llanta moto radial ${medida}`;
  if(m.includes('B')&&m.includes('/'))return`Llanta moto bias ${medida}`;
  return`Llanta moto ${medida}`;
}

// ─── TARIFAS & PRECIOS ───────────────────────────────────────────────────────
const RANGOS=["0-400","401-800","801-1200","1201-1600","1601-2000","2001-2400","2400+"];

// PRECIOS DEL CONVENIO — YA INCLUYEN CRE+EAD
// Verificado con guías reales:
//   GDL→Ags  T5 0-400  = $265 ✅ (=$216.62 flete + $48.38 servicios)
//   GDL→CDMX T6 401-800= $305 ✅ (=$256.62 + $48.38)
//   GDL→HMO  T6 1201-1600=$520 ✅ (=$471.62 + $48.38)
//   GDL→Qro  T6 0-400  = $265 ✅  |  GDL→CDMX mix ✅
const PRECIOS={
  T1:[150,200,250,300,350,400,550],
  T2:[150,200,250,300,350,400,550],
  T3:[205,255,305,405,455,505,755],
  T4:[265,265,305,405,455,505,755],
  T5:[265,305,465,520,630,750,995],
  T6:[265,305,465,520,630,750,995],
  "7P":[4,5.5,8.5,11,12,14,16],
  "7V":[890,1550,2650,3450,4100,4700,5500]
};
// Seguro Zurich: $16.00 FIJO por guía completa (no por paquete)
const SEG_FIJO=16.00;
const ZP=220;   // Zona Plus por paquete
const IVA=1.16;

function ri(km){if(km<=400)return 0;if(km<=800)return 1;if(km<=1200)return 2;if(km<=1600)return 3;if(km<=2000)return 4;if(km<=2400)return 5;return 6;}

// ─── TARIFA REAL PAQUETEXPRESS ─────────────────────────────────────────────
// Reglas confirmadas con 5 guías reales pagadas:
//   1. Peso efectivo = MAX(Vol(m³) × 200, peso real)
//   2. Tarifa por ese peso efectivo: T1≤10 T2≤20 T3≤30 T4≤40 T5≤50 T6≤60 T7>60
//   3. Precio MÍNIMO por paquete = precio T4 del rango
//      (evidencia: guía 10080325 cobró T4 $405 a bulto de 1 llanta, no T6 $520)
//   4. T7: cobra MAX(pe × $/kg, vol × $/m³)
function getTarifa(vol,pr,idx){
  // pe = MAX(volumétrico ×200, peso real) — estándar courier
  const pe=+Math.max(vol*200,pr||0).toFixed(2);
  // Mínimo por paquete = T4 del rango.
  // Evidencia: guía 10080325 (HMO) cobró T4=$405 a bulto de 1 llanta (pv=16kg),
  // NO T6=$520. La regla previa de "mínimo T6" era incorrecta.
  const minimo=PRECIOS.T4[idx];
  let n,costo;
  if(pe<=10)      {n="T1";costo=PRECIOS.T1[idx];}
  else if(pe<=20) {n="T2";costo=PRECIOS.T2[idx];}
  else if(pe<=30) {n="T3";costo=PRECIOS.T3[idx];}
  else if(pe<=40) {n="T4";costo=PRECIOS.T4[idx];}
  else if(pe<=50) {n="T5";costo=PRECIOS.T5[idx];}
  else if(pe<=60) {n="T6";costo=PRECIOS.T6[idx];}
  else{n="T7";costo=+Math.max(pe*PRECIOS["7P"][idx],vol*PRECIOS["7V"][idx]).toFixed(2);}
  if(costo<minimo){costo=minimo;n="T4";} // etiquetado igual que Paquetexpress
  return{n,costo,pe};
}

function calcPkt(llantas,idx,zp){
  // Compresión calibrada con 8 guías reales pagadas (catálogo maestro):
  //   MOTO:  base = diám − 1cm (perfil<14) ó − 2cm (perfil≥14); alto = ΣA × 0.96
  //   ATV:   base = max(60, diám − 4);                          alto = ΣA × 0.87
  //   El tipo se decide por campo t del catálogo maestro (TIPO MEDIDA),
  //   nunca por perfil — una moto 200/55ZR17 (a=20) NO es ATV.
  const esATV = llantas.some(l=>l.t==='ATV');
  const esMousse = llantas.some(l=>l.t==='MOUSSE');
  const mxRaw = Math.max(...llantas.map(l=>l.l));
  const sumA  = llantas.reduce((s,l)=>s+l.a,0);
  let mxL, altoReal;
  if(esMousse){
    // MOUSSE (cajas rígidas): SIN compresión.
    // Base = la de la caja más grande de la pila (66×66 si hay mezcla con 64×64,
    // la base mayor va abajo). Alto = suma exacta de altos de caja.
    mxL = mxRaw;
    altoReal = +sumA.toFixed(1);
  }else if(esATV){
    mxL = Math.max(60, mxRaw-4);
    altoReal = +(sumA*0.87).toFixed(1);
  }else{
    const perfilMax = Math.max(...llantas.map(l=>l.a));
    mxL = mxRaw - (perfilMax>=14?2:1);
    altoReal = +(sumA*0.96).toFixed(1);
  }
  const pr = +llantas.reduce((s,l)=>s+l.p,0).toFixed(2);
  const vol = +((mxL/100)*(mxL/100)*(altoReal/100)).toFixed(5);
  const t = getTarifa(vol,pr,idx);
  const costoBase = t.costo+(zp?ZP:0);
  return{mxL,sumA,altoReal,pr,vol,pv:+(vol*200).toFixed(2),t,costoBase,llantas};
}
function pillClass(n){if(n==="T7")return"pt7";const x=parseInt(n.replace("T",""));if(x<=2)return"pt1";if(x<=4)return"pt3";return"pt5";}

// ─── MOTOR ÓPTIMO ────────────────────────────────────────────────────────────
function optimizar(rows,km,useZP){
  let exp=[];
  for(const r of rows){if(!r.medida)continue;const inf=FIND(r.medida);if(!inf)continue;
    const desc=r.desc||'';const sk=r.medida+'|'+desc; // identidad de SKU: medida + descripción
    for(let i=0;i<r.cant;i++)exp.push({medida:r.medida,desc,sk,...inf});}
  if(!exp.length)return[];
  const idx=ri(km);
  // REGLA: los mousses (cajas) SIEMPRE viajan separados de las llantas para
  // evitar daño a las cajas. Se optimiza cada grupo por su cuenta y se suman.
  const gLlantas=exp.filter(l=>l.t!=='MOUSSE');
  const gMousses=exp.filter(l=>l.t==='MOUSSE');
  let out=[];
  if(gLlantas.length)out=out.concat(optimizarGrupo(gLlantas,idx,useZP));
  if(gMousses.length)out=out.concat(optimizarGrupo(gMousses,idx,useZP));
  return out;
}
function optimizarGrupo(exp,idx,useZP){
  exp.sort((a,b)=>b.l-a.l);
  const skuMap=new Map();
  for(const l of exp){const k=l.sk;if(!skuMap.has(k))skuMap.set(k,{...l,cnt:0});skuMap.get(k).cnt++;}
  const skus=[...skuMap.values()];
  let bestCost=Infinity,bestConfig=null;
  function buscar(state,pkts){
    const total=state.reduce((s,c)=>s+c,0);
    if(total===0){const c=pkts.reduce((s,p)=>s+p.costoBase,0);if(c<bestCost){bestCost=c;bestConfig=pkts.map(p=>({...p,llantas:[...p.llantas]}));}return;}
    // Bound: costo actual + al menos ceil(restantes/15) paquetes × mínimo T4
    const costoAct=pkts.reduce((s,p)=>s+p.costoBase,0);
    if(costoAct+Math.ceil(total/15)*PRECIOS.T4[idx]>=bestCost)return;
    const first=state.findIndex(c=>c>0);
    function limAtado(ch,next){
      const esATV=[...ch,next].some(l=>l.t==='ATV');
      return esATV?4:15;
    }
    function gen(si,cnt,ch){
      const esATVPkt=ch.some(l=>l.t==='ATV');
      const limPkt=esATVPkt?4:15;
      if(si===skus.length){if(!ch.length||ch.length>limPkt)return;const pkt=calcPkt(ch,idx,useZP);const ns=state.map((c,i)=>c-ch.filter(l=>l.sk===skus[i].sk).length);buscar(ns,[...pkts,pkt]);return;}
      const limSig=limAtado(ch,skus[si]);
      const mx=Math.min(cnt[si],limSig-ch.length);const mn=si===first?1:0;
      for(let t=mn;t<=mx;t++){const nc=[...ch];for(let j=0;j<t;j++)nc.push(skus[si]);gen(si+1,cnt,nc);}
    }
    gen(0,[...state],[]);
  }
  // Exacto solo si el espacio es tratable (particiones crecen ~exponencial con #SKUs)
  if(exp.length<=20 && skus.length<=7){buscar(skus.map(s=>s.cnt),[]);}
  // Siempre comparar contra híbrido y quedarse con el más barato
  const hib=optimizarHibrido(exp,idx,useZP);
  const costH=hib.reduce((s,p)=>s+p.costoBase,0);
  if(!bestConfig||costH<bestCost)bestConfig=hib;
  return bestConfig;
}
function optimizarHibrido(exp,idx,useZP){
  exp.sort((a,b)=>b.l-a.l);
  let rest=[...exp],grupos=[];
  while(rest.length){
    let pkt=[rest.shift()],i=0;
    while(i<rest.length){
      const esATV=[...pkt,rest[i]].some(l=>l.t==='ATV');
      const limH=esATV?4:15;
      if(pkt.length>=limH){i++;continue;}
      const c=[...pkt,rest[i]];
      // Evaluar cabida con calcPkt (aplica compresión real) — antes usaba
      // dimensiones sin comprimir y desaprovechaba capacidad
      const test=calcPkt(c,idx,useZP);
      if(test.t.pe<=60){pkt=c;rest.splice(i,1);}else i++;
    }
    grupos.push(pkt);
  }
  const pktsG=grupos.map(g=>calcPkt(g,idx,useZP));
  const costoG=pktsG.reduce((s,p)=>s+p.costoBase,0);
  if(grupos.length>=2){
    for(let i=grupos.length-1;i>=1;i--){
      const merged=[...grupos[i-1],...grupos[i]];const esATVMrg=merged.some(l=>l.t==='ATV');if(merged.length>(esATVMrg?4:15))continue;
      const pm=calcPkt(merged,idx,useZP);
      const co=pktsG.filter((_,j)=>j!==i&&j!==i-1).reduce((s,p)=>s+p.costoBase,0)+pm.costoBase;
      if(co<costoG)return pktsG.filter((_,j)=>j!==i-1&&j!==i).concat([pm]);
    }
  }
  return pktsG;
}

// ─── FUZZY MATCH MEDIDAS ─────────────────────────────────────────────────────
// Normaliza medidas de factura al formato del catálogo:
//   AT25X8.00-12  → 25X8-12
//   AT25X10.00-12 → 25X10-12
//   120/70ZR17 M/C (58W) TL VIENTO SPORT ANLAS → 120/70ZR17
function fuzzyMatch(raw){
  const R=String(raw).toUpperCase();
  // MOUSSE: si la descripción trae MOUSSE o el código PORTMOU, se mapea al
  // catálogo de cajas por su medida ("MOUSSE CAJA 120/90-18", "120/90-18 MOUSSE",
  // "PORTMOU1209018 …"). NUNCA se confunde con la llanta de la misma medida.
  if(/MOUSSE|PORTMOU/.test(R)){
    // v11.9: se acepta CUALQUIER separador entre los 3 números de la medida.
    //   "MOUSSE 140/80-18"  (catálogo)
    //   "140-80-18 Enduro TERRAMousse"  (factura con guiones) ← antes fallaba
    //   "90-100-21 TERRAMousse" / "90/100 - 21" / "140 80 18"
    const mm=R.match(/(\d{2,3})\s*[\/\-\s]\s*(\d{2,3})\s*[\-\/\s]\s*(\d{2})(?!\d)/);
    if(mm){
      const key='MOUSSE '+mm[1]+'/'+mm[2]+'-'+mm[3];
      const fm=CAT.find(c=>c.m===key);
      if(fm)return fm;
    }
    // Fallback por código compacto: "PORTMOU1408018", "PORTMOU 90 100 21", etc.
    // Se compara contra la medida del catálogo reducida a puros dígitos.
    const dig=R.replace(/\D/g,'');
    if(dig.length>=6){
      const fm=CAT.find(c=>c.t==='MOUSSE'&&dig.includes(c.m.replace(/\D/g,'')));
      if(fm)return fm;
    }
    return null; // es mousse pero la medida no está en catálogo de cajas
  }
  let found=CAT.find(c=>c.m.toUpperCase()===raw.toUpperCase());
  if(found)return found;
  const norm=s=>s.toUpperCase()
    .replace(/^AT/,'')       // quita prefijo AT de llantas ATV
    // v11.9: medida moto escrita con guiones → formato catálogo (140-80-18 → 140/80-18)
    .replace(/^(\d{2,3})\s*-\s*(\d{2,3})\s*-\s*(\d{2})(?!\d)/,'$1/$2-$3')
    .replace(/\.00/g,'')    // quita decimales .00 (8.00 → 8)
    .replace(/\s.*$/,'')    // quita todo desde el primer espacio (marca, specs)
    .replace(/M\/C/g,'')   // quita M/C
    .replace(/\s+/g,'')
    .trim();
  const rawN=norm(raw);
  found=CAT.find(c=>norm(c.m)===rawN);
  if(found)return found;
  found=CAT.find(c=>rawN.startsWith(norm(c.m))||norm(c.m).startsWith(rawN));
  return found||null;
}

// ─── LEER PDFs / IMÁGENES DE FACTURA (1 o varias, mismo destino) ───────────
// PDF (CFDI):   A) Cadena Original |ClaveProdServ|Cantidad|H87|Descripción|
//               B) Fallback regex tolerante con espacios
//               C) Fallback parser genérico de texto (facturas de otros emisores)
// Imagen:       OCR con tesseract.js (se carga solo la primera vez) + parser genérico
// Dedupe por Folio Fiscal (UUID). Cantidades de la misma medida se suman entre archivos.
// v11.9: se agrega la forma con guiones "140-80-18" / "90-100-21" (mousses en
// factura). El (?!\d) final evita capturar fechas tipo 08-11-2025.
const MEDIDA_RE=/((?:AT)?\d{2}X[\d.]{1,6}(?:R|-)\d{1,2}|\d{2,3}\/\d{2,3}(?:[A-Z]{1,2}\d{2}|-\d{2})|\d{2,3}-\d{2,3}-\d{2}(?!\d)|\d\.\d{2}-\d{2})/;
function fixOCR(t){
  return t
    .replace(/(\d{2,3}\/\d{2})2R(\d{2})/g,'$1ZR$2')      // 602R17 → 60ZR17
    .replace(/(\d{1,3})\s*%\s*(?=(?:AT)?\d)/g,'$1× ');    // "5% 150…" → "5× 150…"
}
const CANT_RE=/^(\d{1,3})(?:[.,]0{1,2})?\.?$/; // "10", "10.00", "10.00." — NO "$550" ni "5,500.00"
// Si la línea trae MOUSSE/PORTMOU pero la descripción extraída no conservó la
// palabra, se antepone "MOUSSE " para que fuzzyMatch la mande al catálogo de cajas.
function tagMousse(linea,desc){
  return (/MOUSSE|PORTMOU/i.test(linea)&&!/MOUSSE/i.test(desc))?('MOUSSE '+desc):desc;
}
function parseTextoGenerico(txt,acum){
  const lineas=fixOCR(txt).split(/\n/).map(l=>l.trim()).filter(Boolean);
  let n=0;
  for(let i=0;i<lineas.length;i++){
    const l=lineas[i];
    // A0: "2 MOUSSE 120/90-18 …" / "2 MOUSSE CAJA 120/90-18" — cantidad + MOUSSE + medida
    let m=l.match(new RegExp('^(\\d{1,3})\\s+((?:MOUSSE|PORTMOU\\S*)(?:\\s+CAJA)?\\s+'+MEDIDA_RE.source+'.*)$','i'));
    if(m){addLinea(acum,tagMousse(l,m[2].trim()),parseInt(m[1]));n++;continue;}
    // A: "6 110/70-17 DESC…" — cantidad al inicio (tabla de factura)
    m=l.match(new RegExp('^(\\d{1,3})\\s+'+MEDIDA_RE.source+'(.*)$'));
    if(m){addLinea(acum,tagMousse(l,(m[2]+' '+(m[3]||'').trim()).trim()),parseInt(m[1]));n++;continue;}
    // B: "3× 25X8-12" / "3× MOUSSE 120/90-18" — chips / listas
    m=l.match(new RegExp('(\\d{1,3})\\s*[×xX]\\s*((?:MOUSSE\\s+)?(?:CAJA\\s+)?'+MEDIDA_RE.source+')','i'));
    if(m){addLinea(acum,tagMousse(l,m[2]),parseInt(m[1]));n++;continue;}
    // D: medida en CUALQUIER posición — órdenes SAP donde el código precede
    //    ("1107017SPRDRCEAT |110/70ZR17 SPORTRAD TL 54W CEAT 10.00 $550…")
    m=l.match(MEDIDA_RE);
    if(m){
      const desde=l.slice(l.indexOf(m[1]));
      const toks=desde.split(/\s+/);
      let cant=null, corte=toks.length;
      for(let k=1;k<toks.length;k++){
        if(/\$/.test(toks[k])){corte=k;break;}
        const cm=toks[k].match(CANT_RE);
        if(cm){cant=parseInt(cm[1]);corte=k;break;}
      }
      if(cant===null){
        for(let j=i+1;j<=Math.min(i+3,lineas.length-1);j++){
          const t=lineas[j];
          if(MEDIDA_RE.test(t)||/\$/.test(t))break;
          const cm=t.match(CANT_RE);
          if(cm){cant=parseInt(cm[1]);break;}
        }
      }
      addLinea(acum,tagMousse(l,toks.slice(0,corte).join(' ')),cant||1);n++;
    }
  }
  return n;
}
async function preprocesarImagen(file){
  const img=await createImageBitmap(file);
  let esc=img.width<1800?2:1;                 // upscale solo si viene chica/comprimida
  const maxLado=2800;                          // techo: fotos de 4000px+ vuelven lento/inestable el OCR
  if(Math.max(img.width,img.height)*esc>maxLado)esc=maxLado/Math.max(img.width,img.height);
  const cv=document.createElement('canvas');
  cv.width=Math.round(img.width*esc); cv.height=Math.round(img.height*esc);
  const ctx=cv.getContext('2d');
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(img,0,0,cv.width,cv.height);
  const d=ctx.getImageData(0,0,cv.width,cv.height);
  const px=d.data;
  for(let i=0;i<px.length;i+=4){               // grises + contraste suave
    let g=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
    g=Math.max(0,Math.min(255,(g-128)*1.25+128));
    px[i]=px[i+1]=px[i+2]=g;
  }
  ctx.putImageData(d,0,0);
  return cv;
}
let _ocrWorker=null;
async function getOCR(el){
  if(_ocrWorker)return _ocrWorker;
  if(!window.Tesseract){
    if(el)el.textContent='Cargando lector de imágenes (solo la primera vez)…';
    await cargarScript(CDN_TESS).catch(()=>{throw new Error('Sin internet para cargar el lector de imágenes — conéctate y reintenta');});
  }
  try{_ocrWorker=await Tesseract.createWorker('spa');}
  catch(e){_ocrWorker=await Tesseract.createWorker('eng');} // respaldo si el modelo español no descarga
  return _ocrWorker;
}
async function leerArchivos(files){
  const el=document.getElementById('json-status');
  if(!files||!files.length)return;
  const acum=new Map(), uuids=new Set();
  let ok=0, avisos=[];
    for(const f of files){
     try{
      const esImg=/^image\//.test(f.type)||/\.(png|jpe?g|webp|bmp)$/i.test(f.name);
      if(esImg){
        const w=await getOCR(el);
        if(el){el.style.color='#888';el.textContent=`Leyendo imagen ${f.name}…`;}
        // Preprocesar: escala 2×, grises y contraste — mejora fotos de WhatsApp
        const prep=await preprocesarImagen(f);
        // OCR adaptativo: cada layout de tabla lee mejor con un PSM distinto.
        // Se prueban 4 (columna, el mejor p/ órdenes SAP), 3 (auto) y 6 (bloque),
        // y se conserva el intento que extraiga más medidas.
        let best=null;
        for(const psm of ['4','3','6']){
          await w.setParameters({tessedit_pageseg_mode:psm});
          const {data}=await w.recognize(prep);
          const tmp=new Map();
          const n=parseTextoGenerico(data.text||'',tmp);
          if(!best||tmp.size>best.size)best=tmp;
          if(tmp.size>=2)break;               // suficiente señal, no seguir probando
        }
        if(best&&best.size){
          for(const [k,v] of best){            // volcar al acumulador global (suma multi-archivo)
            if(acum.has(k))acum.get(k).cant+=v.cant;
            else acum.set(k,v);
          }
          ok++;
        }
        else avisos.push(`${f.name}: no se detectaron productos legibles — intenta reenviar la imagen como DOCUMENTO en WhatsApp (sin comprimir) o toma la captura más de cerca`);
        continue;
      }
      // ── PDF ──
      if(!window.pdfjsLib)await _pdfjsReady.catch(()=>{});
      if(!window.pdfjsLib){avisos.push(`${f.name}: sin internet para el lector de PDF — conéctate y reintenta`);continue;}
      if(el){el.style.color='#888';el.textContent=`Leyendo ${f.name}…`;}
      const buf=await f.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      let raw='', spaced='';
      for(let p=1;p<=pdf.numPages;p++){
        const tc=await(await pdf.getPage(p)).getTextContent();
        raw+=tc.items.map(i=>i.str).join('');
        spaced+=tc.items.map(i=>i.str).join(' ')+'\n';
      }
      if(/SOLICITUD DE SERVICIO|CARTA PORTE/i.test(raw)&&!/Cadena Original/i.test(raw)){
        avisos.push(`${f.name}: es una GUÍA de Paquetexpress — sube la FACTURA (CFDI)`);continue;
      }
      const um=raw.match(/[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}/i);
      if(um){if(uuids.has(um[0].toUpperCase())){avisos.push(`${f.name}: duplicada, omitida`);continue;}uuids.add(um[0].toUpperCase());}
      let re=/\|(2517\d{4})\|(\d+)(?:\.\d+)?\|H87\|([^|]{3,90})\|/g, m, n=0;
      while((m=re.exec(raw))!==null){addLinea(acum,m[3],parseInt(m[2]));n++;}
      if(!n){
        re=/\|\s*(2517\d{4})\s*\|\s*(\d+)(?:\.\d+)?\s*\|\s*H87\s*\|\s*([^|]{3,90}?)\s*\|/g;
        while((m=re.exec(spaced))!==null){addLinea(acum,m[3],parseInt(m[2]));n++;}
      }
      if(!n)n=parseTextoGenerico(spaced,acum);  // facturas de otros emisores
      if(n)ok++; else avisos.push(`${f.name}: sin conceptos legibles`);
     }catch(e){avisos.push(`${f.name}: ${e.message}`);}
    }
  if(!acum.size){
    if(el){el.style.color='#c44';el.textContent='⚠ No se extrajeron productos. '+(avisos[0]||'');}
    return;
  }
  S.pdfPreview=[...acum.values()].map(v=>{
    const match=fuzzyMatch(v.medida_raw);
    return{medida_raw:v.medida_raw,cant:v.cant,descripcion:v.descripcion,
      medida_matched:match?match.m:null,matched:!!match,usar:true};
  });
  if(el){el.style.color='#FF5C1E';
    el.textContent=`✓ ${ok} archivo(s), ${S.pdfPreview.length} medida(s).`+(avisos.length?` ⚠ ${avisos.join(' · ')}`:'');}
  render();
}
function addLinea(acum,descRaw,cant){
  const d=String(descRaw).trim().replace(/\s{2,}/g,' ');
  if(!d||!cant)return;
  if(/^ENVIOS?$|FLETE|SEGURO/i.test(d))return;
  // Llave = descripción COMPLETA normalizada. Antes se usaba solo el primer
  // token (la medida), lo que fusionaba SKUs distintos de la misma medida
  // (ej. 90/90-17 EUROGRIP vs 90/90-17 PLUSWAY) en una sola línea.
  const key=d.toUpperCase();
  if(acum.has(key))acum.get(key).cant+=cant;
  else acum.set(key,{medida_raw:d,cant,descripcion:d});
}

function importarJSON(jsonText){
  const el=document.getElementById('json-status');
  if(!jsonText||!jsonText.trim()){if(el)el.textContent='⚠ Pega el JSON primero.';return;}
  let lines;
  try{lines=JSON.parse(jsonText.trim());}
  catch(e){if(el)el.textContent='⚠ JSON inválido. Cópialo exactamente como Claude lo generó.';return;}
  if(!Array.isArray(lines)||!lines.length){if(el)el.textContent='⚠ No se encontraron líneas.';return;}
  const preview=lines.map(l=>{
    const match=fuzzyMatch(String(l.medida||''));
    return{medida_raw:String(l.medida||''),cant:Math.max(1,parseInt(l.cant)||1),
      descripcion:String(l.descripcion||l.medida||''),medida_matched:match?match.m:null,matched:!!match,usar:true};
  }).filter(l=>l.medida_raw);
  if(!preview.length){if(el)el.textContent='⚠ No se encontraron medidas válidas.';return;}
  S.pdfPreview=preview;if(el)el.textContent='';render();
}

function upPDFCant(idx,v){if(S.pdfPreview[idx])S.pdfPreview[idx].cant=Math.max(1,parseInt(v)||1);}

// ─── AUTOTEST DE CALIBRACIÓN ────────────────────────────────────────────────
// Corre al abrir. Si una edición futura (catálogo, tarifas, compresión) hace que
// el modelo deje de reproducir las guías reales pagadas, aparece un banner rojo.
function autotest(){
  const f=[];
  const g=(m)=>CAT.find(x=>x.m.toUpperCase()===m); 
  const T=(lls,km,esperado,nombre)=>{
    try{
      const p=calcPkt(lls,ri(km),false);
      if(Math.abs(p.costoBase-esperado)>0.01)f.push(`${nombre}: $${p.costoBase} ≠ $${esperado}`);
    }catch(e){f.push(`${nombre}: ${e.message}`);}
  };
  const a25x8=g('25X8-12'),a25x10=g('25X10-12'),a24x10=g('24X10-11'),m150=g('150/60ZR17'),m110=g('110/70R17');
  if(!a25x8||!a25x10||!a24x10||!m150||!m110){f.push('faltan medidas de referencia en catálogo');}
  else{
    T([a25x8,a25x8,a25x10,a25x10],1420,520,'10081316 HMO 2+2 ATV');   // T6 idx3
    T([a25x10,a25x10,a25x10],1420,520,'10080901 HMO 3×25X10');        // T6 idx3
    T([a24x10],1420,405,'10080325 HMO 1×24X10');                       // mínimo T4 idx3
    T([m150,m150,m150,m150,m150],650,305,'Puebla 5×150/60ZR17');       // T6 idx1
    T([m150,m150,m150,m150,m150,m110],834,465,'Tehuacán 6pz');         // T6 idx2
  }
  // Consistencia interna MOUSSE (derivada del modelo, aún sin guía real pagada):
  //   caja sin compresión, base=mayor, alto=Σaltos, pe=max(vol×200, real), mínimo T4
  const ms90=g('MOUSSE 90/90-21'),ms120=g('MOUSSE 120/90-18');
  if(!ms90||!ms120){f.push('faltan mousses de referencia en catálogo');}
  else{
    T([ms120],1420,405,'MOUSSE 1 caja 64×64×10 (mín. T4 idx3)');       // pv=8.2 → mínimo T4
    T([ms90,ms90,ms120,ms120],220,265,'MOUSSE mixto 66 base 4 cajas'); // 66×66×37 → pv=32.2 → T4=mín idx0
  }
  // ── v11.9: reconocimiento de medidas (fuzzyMatch) ─────────────────────────
  // Casos reales de factura que antes caían en "No encontrada".
  const M=(raw,esperado)=>{
    const r=fuzzyMatch(raw);
    const got=r?r.m:null;
    if(got!==esperado)f.push(`match "${raw}": ${got||'null'} ≠ ${esperado}`);
  };
  M('140-80-18 Enduro TERRAMousse','MOUSSE 140/80-18');
  M('90-100-21 Enduro TERRAMousse','MOUSSE 90/100-21');
  M('MOUSSE 120/90-18','MOUSSE 120/90-18');
  M('PORTMOU1109019','MOUSSE 110/90-19');
  M('140/80-18','140/80-18');            // llanta NO se confunde con mousse
  M('90/100-21 KNIGHT TL','90/100-21');  // llanta NO se confunde con mousse
  M('140-80-18 KNIGHT TL','140/80-18');  // llanta con guiones → sigue siendo llanta
  M('AT25X10.00-12 6PR ATV TERRAPLUS TL KNIGHT','25X10-12');
  M('120/70ZR17 M/C (58W) TL VIENTO SPORT ANLAS','120/70ZR17');
  if(MEDIDA_RE.test('Fecha Pedimento: 08-11-2025'))f.push('MEDIDA_RE captura fechas dd-mm-aaaa');
  if(f.length){
    const d=document.createElement('div');
    d.style.cssText='background:#c0392b;color:#fff;padding:10px 16px;font-size:13px;position:sticky;top:0;z-index:99';
    d.innerHTML='⚠ <b>CALIBRACIÓN ROTA</b> — el modelo ya no reproduce las guías reales de referencia. NO cotizar hasta corregir. Detalle: '+f.join(' · ');
    document.body.prepend(d);
  }
}
document.addEventListener('DOMContentLoaded',autotest);

let S={
  km:220, zp:false, seguro:true, // seguro SIEMPRE activo — obligatorio en toda guía

function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function addRow(){S.rows.push({id:S.nid++,medida:'',cant:1});render();}
function delRow(id){
  if(S.rows.length>1)S.rows=S.rows.filter(r=>r.id!==id);
  else S.rows=[{id:S.nid++,medida:'',cant:1}]; // última línea: se limpia en vez de ignorar el clic
  render();
}
function upRow(id,f,v){const r=S.rows.find(x=>x.id===id);if(r){if(f==='medida'&&r.medida!==v)r.desc='';r[f]=f==='cant'?Math.max(1,+v):v;}render();}
function upKm(v){S.km=Math.max(1,+v);render();}
function upZP(v){S.zp=v;if(S.pkts)calcular();else render();}
function setVista(v){S.vista=v;render();}
function limpiar(){S.rows=[{id:S.nid++,medida:'',cant:1}];S.pkts=null;S.pdfPreview=null;S.guias={};S.descs={};S.vista='pedido';render();}
function getDesc(medida){return S.descs[medida]||DESC(medida);}
// Descripción por llanta: usa la del SKU si viene de factura; si no, la genérica de la medida
function descLl(l){return l.desc||getDesc(l.medida);}
// Agrupa llantas de un paquete por SKU (no por medida) → [etiqueta, cantidad]
function contarSKUs(llantas){
  const counts=new Map();
  for(const l of llantas){const k=descLl(l);counts.set(k,(counts.get(k)||0)+1);}
  return[...counts.entries()];
}
function setDest(km,nombre,ciudad){
  S.km=km;
  if(nombre&&!S.envio.dest)S.envio.dest=nombre;
  if(ciudad&&!S.envio.ciudad)S.envio.ciudad=ciudad;
  if(S.pkts)calcular();else render();
}

function calcular(){
  S.computando=true;render();
  setTimeout(()=>{S.pkts=optimizar(S.rows,S.km,S.zp);S.computando=false;S.vista='paquetes';render();},30);
}
function confirmarPDF(){
  if(!S.pdfPreview)return;
  const matched=S.pdfPreview.filter(l=>l.medida_matched&&l.usar!==false);
  if(matched.length){
    S.rows=S.rows.filter(r=>r.medida);
    for(const l of matched){
      // Un renglón por SKU: solo se suma si medida Y descripción coinciden.
      // Dos productos distintos con la misma medida quedan como líneas separadas.
      const dsc=l.descripcion||'';
      const ex=S.rows.find(r=>r.medida===l.medida_matched&&(r.desc||'')===dsc);
      if(ex)ex.cant+=l.cant;
      else S.rows.push({id:S.nid++,medida:l.medida_matched,cant:l.cant,desc:dsc});
    }
    if(!S.rows.length)S.rows=[{id:S.nid++,medida:'',cant:1}];
  }
  S.pdfPreview=null;render();
}

function renderPedido(){
  const totalL=S.rows.reduce((s,r)=>s+(r.medida?r.cant:0),0);
  const totalP=S.rows.reduce((s,r)=>{if(!r.medida)return s;const inf=FIND(r.medida);return s+(inf?inf.p*r.cant:0);},0);

  // Preview importación JSON

      const usar=l.usar!==false;
      const matchTxt=l.matched?`<span class="match-yes">✓ ${l.medida_matched}</span>`:`<span class="match-no">⚠ No encontrada</span>`;
      return`<div class="preview-row" style="opacity:${usar?1:.4}">
        <div><div style="font-weight:500">${l.medida_raw}</div>${l.descripcion?`<div style="font-size:11px;color:#888">${l.descripcion}</div>`:''}</div>
        <span><input type="number" min="1" value="${l.cant}" style="width:58px;height:28px;text-align:center"
          onchange="upPDFCant(${i},this.value)" title="Verifica la cantidad — puede venir de lectura OCR"></span><span>${matchTxt}</span>
        <button class="btn btn-sm" onclick="togglePDFLine(${i})">${usar?'Excluir':'Incluir'}</button>
      </div>`;
    }).join('');
    const mc=S.pdfPreview.filter(l=>l.matched&&l.usar!==false).length;
    pdfSection=`<div class="card">
      <div class="section-label">Líneas detectadas</div>
      <div class="alert alert-info" style="margin-bottom:8px"><span>📄</span><span>${S.pdfPreview.length} líneas · ${mc} en catálogo · Revisa y confirma</span></div>
      <div class="preview-row header"><span>Medida (PDF)</span><span>Cant.</span><span>Catálogo</span><span></span></div>
      ${rows}
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-primary btn-sm" onclick="confirmarPDF()">✓ Confirmar y agregar al pedido</button>
        <button class="btn btn-sm" onclick="S.pdfPreview=null;render()">Cancelar</button>
      </div>
    </div>`;
  }

  // Destinos frecuentes con búsqueda
  const destBtns=DESTINOS.filter(d=>{
    if(!S.busqDest)return true;
    const q=S.busqDest.toUpperCase();
    return d.nombre.toUpperCase().includes(q)||d.estado.toUpperCase().includes(q);
  }).map(d=>{
    const activo=S.km===d.km&&S.destNombre===d.nombre;
    const vBadge=d.verif?`<span class="verif-badge verif-ok">✓</span>`:`<span class="verif-badge verif-warn">~</span>`;
    return`<button class="dest-btn" style="${activo?'border-color:#FF5C1E;background:#FFEDE4':''}"
      onclick="setDest(${d.km},'${d.nombre}, ${d.estado}','${d.nombre}, ${d.estado}');S.destNombre='${d.nombre}';render()">
      <span class="dest-name">${d.nombre} ${vBadge}</span>
      <span class="dest-km">${d.km} km · ${d.entrega}</span>
    </button>`;
  }).join('');

  return`
  <!-- Importar pedido -->
  <div class="card">
    <div class="section-label">Importar pedido — factura PDF o imagen</div>
    <div style="border:2px dashed #FF5C1E;border-radius:10px;padding:18px;text-align:center;background:#FFF7F2;cursor:pointer"
      onclick="document.getElementById('pdf-files').click()"
      ondragover="event.preventDefault();this.style.background='#FFEDE4'"
      ondragleave="this.style.background='#FFF7F2'"
      ondrop="event.preventDefault();this.style.background='#FFF7F2';leerArchivos(event.dataTransfer.files)">
      <div style="font-size:24px">📄🖼️</div>
      <div style="font-weight:600;margin:4px 0">Sube facturas PDF, fotos o capturas (1 o más, mismo destino)</div>
      <div style="font-size:12px;color:#888">Clic o arrastra aquí · PDF de factura, foto de factura o captura de cotización · Se suman cantidades repetidas</div>
      <input type="file" id="pdf-files" accept="application/pdf,image/*" multiple style="display:none"
        onchange="leerArchivos(this.files);this.value=''">
    </div>
    <div style="margin-top:8px"><span id="json-status" style="font-size:12px;color:#c44"></span></div>

  </div>
  ${pdfSection}

  <!-- Configuración del envío -->
  <div class="card">
    <div class="section-label">Destino y configuración</div>
    <!-- KM + controles -->
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px">
      <label style="font-size:13px;color:#555;white-space:nowrap;font-weight:500">Kilómetros al destino:</label>
      <input type="number" min="1" max="9999" value="${S.km}" style="width:90px" onchange="upKm(+this.value)">
      <span style="font-size:12px;padding:3px 10px;border-radius:10px;background:#f5f5f3;font-weight:600;color:#555">Rango ${RANGOS[ri(S.km)]}</span>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#555;margin-left:auto;cursor:pointer">
        <input type="checkbox" ${S.zp?'checked':''} onchange="upZP(this.checked)"> Zona Plus (+$${ZP}/paquete)
      </label>
    </div>
    <!-- Destinos frecuentes -->
    <div style="font-size:11px;color:#888;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">
      <span>Destinos frecuentes — <span class="verif-badge verif-ok">✓</span> destino confirmado &nbsp; <span class="verif-badge verif-warn">~</span> distancia oficial del convenio</span>
      ${S.km?`<span style="background:#FFEDE4;color:#B23A08;font-weight:600;padding:3px 10px;border-radius:8px;font-size:12px">⏱ Entrega: ${DESTINOS.find(d=>d.km===S.km)?.entrega||RANGOS[ri(S.km)]}</span>`:''}
    </div>
    <input type="text" placeholder="🔍 Buscar ciudad o estado..." value="${S.busqDest}"
      style="margin-bottom:8px" oninput="S.busqDest=this.value;render()">
    <div class="dest-grid">${destBtns}</div>
    <!-- Servicios incluidos -->
    <div style="border-top:1px solid #eee;padding-top:10px;margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center">
      <span style="font-size:11px;color:#888;font-weight:600;text-transform:uppercase">Incluidos en precio:</span>
      <span style="font-size:13px;color:#555"><span style="color:#FF5C1E">✓</span> CRE recolección</span>
      <span style="font-size:13px;color:#555"><span style="color:#FF5C1E">✓</span> EAD entrega a domicilio</span>
      <span style="display:flex;align-items:center;gap:6px;font-size:13px;color:#555;margin-left:auto">
        <span style="color:#FF5C1E">✓</span> Seguro Zurich <span style="color:#888;font-size:11px">($${SEG_FIJO} fijo por guía · siempre incluido)</span>
      </span>
    </div>
  </div>

  <!-- Líneas del pedido -->
  <div class="card">
    <div class="section-label" style="margin-bottom:8px">Líneas del pedido (manual)</div>
    <div class="pedido-header">
      <span>#</span><span>Medida</span><span>Cant.</span><span>Dim. L×A×H (cm)</span>
      <span style="text-align:center">P.unit.</span><span style="text-align:center">P.tot.</span><span></span>
    </div>
    ${S.rows.map((r,i)=>{
      const inf=r.medida?FIND(r.medida):null;
      return`<div class="pedido-row">
        <span class="rnum">${i+1}</span>
        <div>
          <select onchange="upRow(${r.id},'medida',this.value)" ${r.desc?`title="${r.desc}"`:''}>
            <option value="">— Seleccionar —</option>
            ${MEDIDAS.map(m=>`<option value="${m}"${r.medida===m?' selected':''}>${m}</option>`).join('')}
          </select>
          ${r.desc?`<div style="font-size:10px;color:#888;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.desc}</div>`:''}
        </div>
        <input type="number" min="1" max="999" value="${r.cant}" style="text-align:center;${r.cant>15?'border-color:#EF9F27;background:#FAEEDA':''}" onchange="upRow(${r.id},'cant',+this.value)">
        ${inf?`<div class="dbadge">${inf.l}×${inf.l}×${inf.a}</div>`:`<div class="dbadge" style="color:#ccc">—</div>`}
        ${inf?`<div class="wbadge">${inf.p}kg</div>`:`<div></div>`}
        ${inf?`<div class="wbadge">${(inf.p*r.cant).toFixed(1)}kg</div>`:`<div></div>`}
        <button class="btn btn-sm btn-icon" onclick="delRow(${r.id})">✕</button>
      </div>`;
    }).join('')}
    <button class="btn btn-sm btn-secondary" style="margin-top:8px" onclick="addRow()">+ Agregar medida</button>
  </div>

  ${S.computando
    ?`<div style="display:flex;align-items:center;gap:10px;padding:12px;font-size:13px;color:#888"><span class="spin">⟳</span> Calculando combinación óptima…</div>`
    :`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="calcular()">⟳ Calcular paquetes →</button>
      <button class="btn btn-secondary" onclick="limpiar()">Nuevo pedido</button>
      <span style="margin-left:auto;font-size:13px;color:#888">${totalL} pza${totalL!==1?'s':''} · ${totalP.toFixed(1)} kg</span>
    </div>`}`;
}

// ─── RENDER PAQUETES ─────────────────────────────────────────────────────────
function renderPaquetes(){
  if(!S.pkts||!S.pkts.length)return`<div style="text-align:center;padding:3rem;color:#aaa">Captura el pedido y presiona "Calcular paquetes"</div>`;
  const totalBase=S.pkts.reduce((s,p)=>s+p.costoBase,0);
  const seguro=S.seguro?SEG_FIJO:0;
  const subtotal=totalBase+seguro;
  const totalIVA=subtotal*IVA;
  const totalL=S.pkts.reduce((s,p)=>s+p.llantas.length,0);
  const totalP=S.pkts.reduce((s,p)=>s+p.pr,0);
  const hayT7=S.pkts.some(p=>p.t.n==='T7');

  const entrega=DESTINOS.find(d=>d.km===S.km)?.entrega||'—';
  const pktsHtml=S.pkts.map((p,i)=>{
    const chips=contarSKUs(p.llantas).map(([d,n])=>`<span class="chip" title="${d}">${n}× ${d}</span>`).join('');
    const pc=pillClass(p.t.n);
    return`<div class="pkt-wrap">
      <div class="pkt-head">
        <span class="pkt-title">Paquete ${i+1} · ${p.llantas.length} pza${p.llantas.length!==1?'s':''}${p.llantas.some(l=>l.t==='MOUSSE')?' 📦 MOUSSE':''}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="pill ${pc}">${p.t.n}</span>
          <span style="font-weight:600">$${p.costoBase.toFixed(0)}</span>
        </div>
      </div>
      <div class="pkt-body">
        <div class="chips">${chips}</div>
        <div class="dims-grid">
          <div class="dim"><div class="dim-lbl">Largo</div><div class="dim-val">${p.mxL}cm</div></div>
          <div class="dim"><div class="dim-lbl">Ancho</div><div class="dim-val">${p.mxL}cm</div></div>
          <div class="dim"><div class="dim-lbl">Alto</div><div class="dim-val">${p.altoReal}cm</div></div>
          <div class="dim"><div class="dim-lbl">Volumen</div><div class="dim-val">${p.vol.toFixed(4)}m³</div></div>
          <div class="dim"><div class="dim-lbl">P.Real</div><div class="dim-val">${p.pr.toFixed(1)}kg</div></div>
          <div class="dim"><div class="dim-lbl">Vol×200</div><div class="dim-val">${p.pv.toFixed(1)}kg</div></div>
        </div>
      </div>
    </div>`;
  }).join('');

  const resumenRows=S.pkts.map((p,i)=>`<tr>
    <td>PKT ${i+1}</td><td style="text-align:center">${p.llantas.length}</td>
    <td>${p.mxL}×${p.mxL}×${p.altoReal}</td>
    <td class="r">${p.pr.toFixed(1)}kg</td><td class="r">${p.pv.toFixed(1)}kg</td>
    <td><span class="pill ${pillClass(p.t.n)}" style="font-size:10px">${p.t.n}</span></td>
    <td class="r">$${p.costoBase.toFixed(0)}</td>
  </tr>`).join('');

  return`
  <div class="alert alert-ok"><span>✓</span><span>Motor óptimo — distribución de menor costo. Destino: ${RANGOS[ri(S.km)]} (${S.km} km) &nbsp;·&nbsp; <strong>Entrega estimada: ${entrega}</strong></span></div>
  ${hayT7?`<div class="alert alert-warn"><span>⚠</span><span>Uno o más paquetes exceden T6 — aplica Tarifa 7 (mayor entre peso×$/kg y volumen×$/m³).</span></div>`:''}
  <div class="metrics">
    <div class="metric"><div class="metric-label">Paquetes</div><div class="metric-val">${S.pkts.length}</div></div>
    <div class="metric"><div class="metric-label">Piezas</div><div class="metric-val">${totalL}</div></div>
    <div class="metric"><div class="metric-label">Peso total</div><div class="metric-val">${totalP.toFixed(1)}kg</div></div>
    <div class="metric metric-best"><div class="metric-label">Total con IVA</div><div class="metric-val">$${totalIVA.toFixed(2)}</div><div class="metric-sub">Base $${subtotal.toFixed(0)} · IVA $${(subtotal*0.16).toFixed(0)}</div></div>
  </div>
  ${pktsHtml}
  <hr class="div">
  <div class="card" style="margin-bottom:0">
    <div class="section-label" style="margin-bottom:8px">Resumen del costo</div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>Paquete</th><th style="text-align:center">Pzas.</th><th>L×A×H (cm)</th><th class="r">P.real</th><th class="r">P.vol.</th><th>Tarifa</th><th class="r">Costo</th></tr></thead>
        <tbody>${resumenRows}
          <tr class="total-row"><td colspan="3">Subtotal paquetes</td><td class="r">${totalP.toFixed(1)}kg</td><td class="r">—</td><td>—</td><td class="r">$${totalBase.toFixed(2)}</td></tr>
          <tr><td colspan="6" style="color:#FF5C1E;font-size:11px">✓ CRE+EAD y seguro incluidos · Precio final por paquete</td><td></td></tr>
          ${S.seguro?`<tr><td colspan="6" style="color:#888">Seguro Zurich (fijo por guía)</td><td class="r">$${SEG_FIJO.toFixed(2)}</td></tr>`:''}
          ${S.zp?`<tr><td colspan="6" style="color:#888">Zona Plus (${S.pkts.length} × $${ZP})</td><td class="r">$${(ZP*S.pkts.length).toFixed(0)}</td></tr>`:''}
          <tr><td colspan="6" style="color:#888">Subtotal</td><td class="r">$${subtotal.toFixed(2)}</td></tr>
          <tr><td colspan="6" style="color:#888">IVA 16%</td><td class="r">$${(subtotal*0.16).toFixed(2)}</td></tr>
          <tr><td colspan="6" style="font-weight:600;color:#D94A0F">Total con IVA</td><td class="r" style="font-weight:600;color:#D94A0F">$${totalIVA.toFixed(2)}</td></tr>
        </tbody>
      </table>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="setVista('envio')">Continuar → Datos del envío</button>
      <button class="btn btn-secondary btn-sm" onclick="setVista('pedido')">← Modificar pedido</button>
      <button class="btn btn-secondary btn-sm" onclick="limpiar()">Nuevo pedido</button>
    </div>
  </div>`;
}

// ─── RENDER ENVÍO ────────────────────────────────────────────────────────────
function renderEnvio(){
  if(!S.pkts||!S.pkts.length)return`<div style="text-align:center;padding:3rem;color:#aaa">Primero calcula los paquetes.</div>`;
  const guiaRows=S.pkts.map((p,i)=>{
    const contenido=contarSKUs(p.llantas).map(([d,n])=>`${n}× ${d}`).join(', ');
    const pc=pillClass(p.t.n);
    return`<div class="guide-row">
      <div>
        <div class="guide-label">PKT ${i+1} <span class="pill ${pc}" style="font-size:10px;margin-left:4px">${p.t.n}</span></div>
        <div style="font-size:11px;color:#888;margin-top:2px">${contenido}</div>
      </div>
      <input type="text" placeholder="Número de guía Paquetexpress" value="${S.guias[i]||''}" onchange="S.guias[${i}]=this.value">

  return`
  <div class="card">
    <div class="section-label">Datos del envío</div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Folio / Número de pedido</label>

      <div class="form-group">

      <label class="form-label">Nombre del destinatario</label>

      <label class="form-label">Dirección de entrega</label>
      <input type="text" placeholder="Calle, número, colonia" value="${S.envio.dir}" onchange="S.envio.dir=this.value">
    </div>
    <div class="form-group" style="margin-top:10px">
      <label class="form-label">Ciudad / Estado / CP</label>
      <input type="text" placeholder="Ej. Aguascalientes, Ags, CP 20000" value="${S.envio.ciudad}" onchange="S.envio.ciudad=this.value">
    </div>
  </div>
  <div class="card">
    <div class="section-label">Números de guía por paquete</div>
    <div style="font-size:12px;color:#888;margin-bottom:10px">Ingresa el número de guía que asignó Paquetexpress a cada paquete.</div>
    ${guiaRows}
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="setVista('packing')">Ver Packing List →</button>
    <button class="btn btn-secondary" onclick="setVista('paquetes')">← Paquetes</button>
  </div>`;
}

// ─── RENDER PACKING LIST ─────────────────────────────────────────────────────
function renderPacking(){
  if(!S.pkts||!S.pkts.length)return`<div style="text-align:center;padding:3rem;color:#aaa">Primero calcula los paquetes.</div>`;
  const faltaDato=!S.envio.dest&&!S.envio.folio;
  const totalBase=S.pkts.reduce((s,p)=>s+p.costoBase,0);
  const seg=S.seguro?SEG_FIJO:0;
  const subtotal=totalBase+seg;

  const pktsPreview=S.pkts.map((p,i)=>{
    const contenidoLineas=contarSKUs(p.llantas).map(([d,n])=>{
      return`<div style="font-size:12px;padding:2px 0;border-bottom:1px dotted #eee;display:flex;justify-content:space-between">
        <span>${d}</span><span style="font-weight:600;margin-left:12px;white-space:nowrap">${n} pza${n>1?'s':''}</span>
      </div>`;
    }).join('');
    const pc=pillClass(p.t.n);
    return`<div class="pl-card">
      <div class="pl-pkt-head">
        <div style="font-weight:600;font-size:13px">Paquete ${i+1} &nbsp;<span class="pill ${pc}" style="font-size:10px">${p.t.n}</span></div>
        <div style="font-size:13px;font-weight:600">$${p.costoBase.toFixed(0)}</div>
      </div>
      <div class="pl-pkt-body">
        <div class="pl-row"><span style="color:#888">Guía</span><span style="font-weight:600;color:${S.guias[i]?'#1a1a18':'#aaa'}">${S.guias[i]||'—'}</span></div>
        <div style="padding:4px 0;border-bottom:1px solid #eee">
          <div style="font-size:11px;color:#888;margin-bottom:4px">Contenido</div>${contenidoLineas}
        </div>
        <div class="pl-row"><span style="color:#888">Dimensiones</span><span>${p.mxL}×${p.mxL}×${p.sumA} cm</span></div>
        <div class="pl-row"><span style="color:#888">Peso real</span><span>${p.pr.toFixed(1)} kg</span></div>
        <div class="pl-row"><span style="color:#888">Peso vol.</span><span>${p.pv.toFixed(1)} kg</span></div>
        <div class="pl-row"><span style="color:#888">Volumen</span><span>${p.vol.toFixed(4)} m³</span></div>
      </div>
    </div>`;
  }).join('');

  return`
  ${faltaDato?`<div class="alert alert-warn"><span>⚠</span><span>Faltan datos del envío. <button class="btn btn-sm" style="margin-left:8px" onclick="setVista('envio')">Completar →</button></span></div>`:''}
  <div class="card" style="border-color:#FF5C1E">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:18px;font-weight:700;color:#FF5C1E">PACKING LIST</div>
        <div style="font-size:12px;color:#888">Optimizador · Paquetexpress</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:13px;font-weight:600">Folio: ${S.envio.folio||'—'}</div>
        <div style="font-size:12px;color:#888">Fecha: ${today()}</div>
        <div style="font-size:12px;color:#888">${S.km} km · ${RANGOS[ri(S.km)]}${S.zp?' · Zona Plus':''}</div>
      </div>
    </div>
    <hr class="div">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <div style="font-size:11px;color:#888;font-weight:600;text-transform:uppercase;margin-bottom:4px">Destinatario</div>
        <div style="font-weight:600">${S.envio.dest||'—'}</div>
        <div style="font-size:12px;color:#555">${S.envio.dir||'—'}</div>
        <div style="font-size:12px;color:#555">${S.envio.ciudad||'—'}</div>
        ${S.envio.tel?`<div style="font-size:12px;color:#555">Tel: ${S.envio.tel}</div>`:''}
      </div>
      <div>
        <div style="font-size:11px;color:#888;font-weight:600;text-transform:uppercase;margin-bottom:4px">Resumen</div>
        <div style="font-size:12px">Paquetes: <strong>${S.pkts.length}</strong></div>
        <div style="font-size:12px">Piezas: <strong>${S.pkts.reduce((s,p)=>s+p.llantas.length,0)}</strong></div>
        <div style="font-size:12px">Subtotal: <strong>$${subtotal.toFixed(2)}</strong></div>
        <div style="font-size:13px;color:#D94A0F;font-weight:600">Total c/IVA: $${(subtotal*IVA).toFixed(2)}</div>
      </div>
    </div>
  </div>
  ${pktsPreview}
  <div class="card">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;text-align:center">
      ${['Elaboró / Almacén','Recibió / Transportista','Fecha de entrega'].map(f=>`
      <div>
        <div style="font-size:11px;color:#888;margin-bottom:20px">${f}</div>
        <div style="border-top:1px solid #ddd;padding-top:4px;font-size:11px;color:#aaa">Nombre y firma</div>
      </div>`).join('')}
    </div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
    <button class="btn btn-primary" onclick="generarPackingPDF()">⬇ Descargar PDF</button>
    <button class="btn btn-green-outline" onclick="window.print()">🖨 Imprimir</button>
    <button class="btn btn-secondary" onclick="setVista('envio')">← Editar datos</button>
    <button class="btn btn-secondary" onclick="limpiar()">Nuevo pedido</button>
  </div>`;
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render(){
  const root=document.getElementById('root');
  const tabs=[
    {id:'pedido',label:'Pedido',num:null},
    {id:'paquetes',label:'Paquetes',num:S.pkts?S.pkts.length:null},
    {id:'envio',label:'Envío',num:null},
    {id:'packing',label:'Packing List',num:null},
  ];
  const disabled=!S.pkts;
  const tabsHtml=tabs.map(t=>{
    const isDisabled=t.id!=='pedido'&&disabled;
    const cls=`tab${S.vista===t.id?' active':''}${isDisabled?' disabled':''}`;
    const onclick=isDisabled?'':'onclick="setVista(\''+t.id+'\')"';
    const num=t.num?`<span class="tab-num">${t.num}</span>`:'';
    return`<button class="${cls}" ${onclick}>${t.label}${num}</button>`;
  }).join('');
  let content='';
  if(S.vista==='pedido')content=renderPedido();
  else if(S.vista==='paquetes')content=renderPaquetes();
  else if(S.vista==='envio')content=renderEnvio();
  else if(S.vista==='packing')content=renderPacking();
  root.innerHTML=`<div class="tabs">${tabsHtml}</div>${content}`;
}

render();
</script>

<!-- ═══════════════════════════════════════════════════════════════
     PUENTE CON EL PORTAL LLANTY.APP — CONSERVAR ESTE BLOQUE
     Si actualizas el optimizador, pega este bloque completo al final
     del archivo nuevo, antes de </body>. Sin él, el portal no puede
     guardar/reabrir packing lists ni inyectar destinos guardados.
     ═══════════════════════════════════════════════════════════════ -->
<script>
window.__LLANTY = {
  version: 1,
  // El portal lee el estado completo para guardarlo con folio.
  getEstado(){
    return {
      rows: S.rows.filter(r=>r.medida).map(r=>({medida:r.medida,cant:r.cant,desc:r.desc||''})),
      km:S.km, zp:!!S.zp, seguro:!!S.seguro,
      destNombre:S.destNombre||'', envio:{...S.envio},
      calculado: !!(S.pkts&&S.pkts.length),
    };
  },
  // El portal restaura un estado guardado (REABRIR del historial).
  setEstado(e){
    try{
      if(!e) return false;
      const rows=(e.rows&&e.rows.length)?e.rows:[{medida:'',cant:1}];
      S.rows=rows.map((r,i)=>({id:i+1,medida:String(r.medida||''),cant:Math.max(1,parseInt(r.cant)||1),desc:r.desc||''}));
      S.nid=S.rows.length+1;
      if(e.km) S.km=Math.max(1,parseInt(e.km)||S.km);
      S.zp=!!e.zp;
      if(typeof e.seguro==='boolean') S.seguro=e.seguro;
      S.destNombre=e.destNombre||'';
      if(e.envio) S.envio={folio:'',dest:'',dir:'',ciudad:'',tel:'',...e.envio};
      S.pkts=null; S.pdfPreview=null; S.vista='pedido'; render();
      if(e.calculado) calcular();
      return true;
    }catch(err){ return false; }
  },
  // El portal inyecta un destino guardado (km + datos de envío) sin
  // tocar las llantas ya capturadas.
  setDestino(d){
    try{
      if(!d) return false;
      if(d.km) S.km=Math.max(1,parseInt(d.km)||S.km);
      S.destNombre=d.nombre||S.destNombre;
      S.envio={...S.envio,
        dest:d.nombre||S.envio.dest,
        dir:d.dir||S.envio.dir,
        ciudad:d.ciudad||S.envio.ciudad,
        tel:d.tel||S.envio.tel};
      render();
      return true;
    }catch(err){ return false; }
  },
};
</script>
